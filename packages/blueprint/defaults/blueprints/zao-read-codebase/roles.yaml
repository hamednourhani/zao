# Role definitions for the zao-read-codebase blueprint.
schema_version: "0.3.0"

model_defaults:
  default_llm_id: "deepseek:deepseek-chat"

roles:
  developer:
    prompt_template: "You are a developer agent. Read the file, report its full contents and structure. Include the file path, line count, key functions/classes, and any notable patterns."
    context_budget: 0.65
    llm_id: null

  reviewer:
    prompt_template: "You are a reviewer. Summarize the provided file contents into exactly 3 concise bullet points covering: purpose, structure, and key observations."
    context_budget: 0.40
    llm_id: null
