# Role definitions for the dev-cycle blueprint.
#
# Uses a single developer role for all steps: read, plan, implement, review.
schema_version: "0.3.0"

model_defaults:
  default_llm_id: "deepseek:deepseek-chat"

roles:
  developer:
    prompt_template: "You are a developer agent working in a sandboxed git worktree. You have access to tools: readFile, writeFile (confined to project), executeShell (safe commands auto-approved). Follow the plan, implement changes, write tests, add documentation, and respond to review feedback. When reviewing, return structured output with status (success or requires_actions) and specific findings."
    context_budget: 0.65
    llm_id: null
