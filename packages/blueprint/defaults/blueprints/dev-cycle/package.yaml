# dev-cycle Blueprint — read → plan → implement → review (loop)
#
# Universal development cycle: read the codebase, plan the implementation,
# implement the changes, and review the results. The implement→review loop
# iterates up to 5 times, with review feedback feeding into each retry.
# Sandboxed in git worktree; human confirms merge after review approval.
